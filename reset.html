<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https://qyerrlteeoiudtgmguzk.supabase.co https://*.supabase.co; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; frame-ancestors 'none'; base-uri 'self';">
  <meta name="theme-color" content="#050505">
  <title>VitalIA</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #050505;
      --surface: #0e0e0e;
      --text: #f6f8fb;
      --muted: #9ba4b4;
      --green: #00E676;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at 50% 0%, rgba(0, 230, 118, 0.08), transparent 32%), var(--bg);
      color: var(--text);
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(88vw, 360px);
      padding: 28px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 24px;
      background: rgba(14, 14, 14, 0.92);
      box-shadow: 0 18px 42px rgba(0, 0, 0, 0.34);
      text-align: center;
    }

    .mark {
      width: 54px;
      height: 54px;
      margin: 0 auto 18px;
      border-radius: 18px;
      display: grid;
      place-items: center;
      background: rgba(0, 230, 118, 0.08);
      border: 1px solid rgba(0, 230, 118, 0.16);
      color: var(--green);
      font-size: 28px;
      font-weight: 700;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 24px;
      letter-spacing: 0;
    }

    p {
      margin: 0;
      color: var(--muted);
      line-height: 1.55;
      font-size: 15px;
    }
  </style>
</head>
<body>
  <main>
    <div class="mark">V</div>
    <h1>VitalIA</h1>
    <p aria-live="polite"></p>
  </main>
  <script src="./release.js"></script>
  <script src="./js/core/i18n.js"></script>
  <script>
    let storedLang = ''; try { storedLang = localStorage.getItem('v_lang') || ''; } catch(_) {}
    const requestedLang = (storedLang || navigator.language || 'en').slice(0,2).toLowerCase();
    const copy = I18N[requestedLang] || I18N.en;
    document.documentElement.lang = I18N[requestedLang] ? requestedLang : 'en';
    document.title = copy.pwa_updating;
    document.querySelector('h1').textContent = copy.pwa_updating;
    const info = document.querySelector('p');
    const retry = document.createElement('button');
    retry.textContent = copy.pwa_update_retry;
    retry.style.cssText = 'margin-top:16px;padding:10px 14px;border-radius:12px;border:1px solid var(--green);background:transparent;color:var(--green);cursor:pointer';
    retry.onclick = updateVitalIA;
    document.querySelector('main').appendChild(retry);
    const open = document.createElement('a');open.href='./';open.textContent=copy.pwa_update_open;
    open.style.cssText='display:block;margin-top:12px;color:var(--green)';
    document.querySelector('main').appendChild(open);
    async function updateVitalIA() {
      info.textContent = copy.pwa_update_info;
      if(!navigator.onLine) { info.textContent=copy.pwa_update_offline;return; }
      retry.disabled=true;
      try {
        if(!('serviceWorker' in navigator)) throw new Error('PWA unavailable');
        const root = new URL('./',location.href).href;
        let registration = await navigator.serviceWorker.getRegistration(root);
        if(!registration || registration.scope!==root)registration=await navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'});
        await registration.update();
        const worker=registration.installing;
        if(worker && worker.state!=='installed') await new Promise((resolve,reject)=>{
          const timer=setTimeout(()=>reject(new Error('Update deadline')),30000);
          worker.addEventListener('statechange',()=>{
            if(worker.state==='installed'){clearTimeout(timer);resolve();}
            if(worker.state==='redundant'){clearTimeout(timer);reject(new Error('Release verification failed'));}
          });
        });
        if(registration.waiting) {
          await new Promise((resolve,reject)=>{
            const timer=setTimeout(()=>reject(new Error('Activation deadline')),30000);
            navigator.serviceWorker.addEventListener('controllerchange',()=>{clearTimeout(timer);resolve();},{once:true});
            registration.waiting.postMessage({type:'VITALIA_SKIP_WAITING'});
          });
        }
        // The verified worker removes only obsolete VitalIA caches during activation.
        // Never unregister other applications, purge user storage or discard the usable offline shell.
        location.replace('./?v='+encodeURIComponent(globalThis.VITALIA_APP_VERSION));
      } catch(_) { info.textContent=copy.pwa_update_failed;retry.disabled=false; }
    }
    updateVitalIA();
  </script>
</body>
</html>
