<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https://qyerrlteeoiudtgmguzk.supabase.co https://*.supabase.co; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; frame-ancestors 'none'; base-uri 'self';">
  <meta name="theme-color" content="#050505">
  <title>VitalIA | Atualizando</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #050505;
      --surface: #0e0e0e;
      --text: #f6f8fb;
      --muted: #9ba4b4;
      --green: #00E676;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at 50% 0%, rgba(0, 230, 118, 0.08), transparent 32%), var(--bg);
      color: var(--text);
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(88vw, 360px);
      padding: 28px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 24px;
      background: rgba(14, 14, 14, 0.92);
      box-shadow: 0 18px 42px rgba(0, 0, 0, 0.34);
      text-align: center;
    }

    .mark {
      width: 54px;
      height: 54px;
      margin: 0 auto 18px;
      border-radius: 18px;
      display: grid;
      place-items: center;
      background: rgba(0, 230, 118, 0.08);
      border: 1px solid rgba(0, 230, 118, 0.16);
      color: var(--green);
      font-size: 28px;
      font-weight: 700;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 24px;
      letter-spacing: 0;
    }

    p {
      margin: 0;
      color: var(--muted);
      line-height: 1.55;
      font-size: 15px;
    }
  </style>
</head>
<body>
  <main>
    <div class="mark">V</div>
    <h1>Atualizando VitalIA</h1>
    <p>Estou limpando a versao antiga do navegador e abrindo o app premium atualizado.</p>
  </main>
  <script>
    (async function resetVitalIA() {
      const target = './?v=20260507-v20';

      try {
        if ('serviceWorker' in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          await Promise.all(registrations.map(registration => registration.unregister()));
        }

        if ('caches' in window) {
          const keys = await caches.keys();
          await Promise.all(keys.map(key => caches.delete(key)));
        }

        localStorage.setItem('vitalia_cache_reset', '20260507-v20');
      } catch (error) {
        console.warn('[VitalIA] Reset de cache continuou com fallback.', error);
      }

      window.location.replace(target);
    })();
  </script>
</body>
</html>
